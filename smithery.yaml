# Smithery listing for the hosted ScenarioSim MCP server (remote, Streamable HTTP).
# Docs: https://smithery.ai/docs
startCommand:
  type: http
  url: "https://scenariosim-mcp.pages.dev/mcp"
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        title: "API key (optional)"
        description: "Paid-plan key (ssim_live_...). Leave blank for the free tier."
    required: []
  exampleConfig:
    apiKey: ""
